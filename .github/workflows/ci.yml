name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/platform
      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          helm template platform deploy/helm/platform > default.yaml
          helm template platform deploy/helm/platform \
            --set ingress.enabled=true --set autoscaling.enabled=false \
            --set telemetry.otlpEndpoint=http://otel-collector:4318 \
            --set ai.provider=anthropic --set ai.model=a-model --set ai.keySecret=ai-key \
            --set ai.baseUrl=https://gateway.example.com > variant.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 default.yaml variant.yaml
      - name: Refuse unsafe values
        run: |
          for args in "--set config.PUBLIC_BASE_URL=http://insecure.example.com" \
                      "--set config.DATABASE_URL=postgres://user:pass@db/platform" \
                      "--set existingSecret=" \
                      "--set config.MFA_EVIDENCE=assume" \
                      "--set ai.provider=anthropic --set ai.model=a-model" \
                      "--set ai.provider=anthropic --set ai.keySecret=ai-key" \
                      "--set ai.provider=anthropic --set ai.model=a-model --set ai.keySecret=ai-key --set ai.baseUrl=http://gateway.example.com" \
                      "--set config.AI_PROVIDER=anthropic"; do
            if helm template platform deploy/helm/platform $args > /dev/null 2>&1; then
              echo "::error::The chart accepted unsafe values: $args"; exit 1
            fi
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_VERSION: v0.33.0
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Install kind
        run: |
          curl -sSfLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t platform-api:e2e .
      - name: Install the chart on a kind cluster and test it end to end
        run: deploy/helm/e2e/run.sh
