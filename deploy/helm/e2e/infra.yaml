# Test-only infrastructure for the chart's end-to-end test: namespaces and a throwaway PostgreSQL.
# The platform namespace enforces the "restricted" Pod Security Standard, so the chart's pods are
# only admitted if they really comply.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
# Stands in for the ingress controller's namespace, which the chart's network policy allows.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: POSTGRES_IMAGE
          imagePullPolicy: Never
          env:
            - { name: POSTGRES_USER, value: platform }
            - { name: POSTGRES_PASSWORD, value: platform-e2e }
            - { name: POSTGRES_DB, value: platform }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "platform"] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
