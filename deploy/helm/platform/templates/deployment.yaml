apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-api
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when the configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "platform.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "platform.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "platform.fullname" . }}
            - secretRef:
                name: {{ required "existingSecret is required: a Secret with DATABASE_URL, COOKIE_SECRET and AUDIT_SIGNING_KEY_PEM" .Values.existingSecret }}
          {{- if or .Values.extraEnv .Values.ai.provider }}
          env:
            {{- if .Values.ai.provider }}
            # The model of the studio's chat. Its key is a file, so a renewed Secret needs no restart.
            - name: AI_PROVIDER
              value: {{ .Values.ai.provider | quote }}
            - name: AI_MODEL
              value: {{ required "ai.model is required with ai.provider: the model's ID at the provider" .Values.ai.model | quote }}
            - name: AI_API_KEY_FILE
              value: /var/run/secrets/ai/key
            {{- with .Values.ai.baseUrl }}
            - name: AI_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: AI_EFFORT
              value: {{ .Values.ai.effort | default "high" | quote }}
            - name: AI_FALLBACK
              value: {{ .Values.ai.fallback | default "default" | quote }}
            - name: AI_MAX_TURNS
              value: {{ .Values.ai.maxTurns | default 12 | toString | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ required "every extraEnv entry needs a name" .name }}
              {{- if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              # Kubernetes needs strings: quote numbers and booleans passed with --set.
              value: {{ .value | toString | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          lifecycle:
            # Give load balancers time to stop routing here before the server begins shutting down.
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            {{- include "platform.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.ai.provider }}
            - name: ai-key
              mountPath: /var/run/secrets/ai
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.ai.provider }}
        - name: ai-key
          secret:
            secretName: {{ required "ai.keySecret is required with ai.provider: a Secret with the provider's API key under the key key" .Values.ai.keySecret }}
            items:
              - key: key
                path: key
        {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
