# Local development dependencies: PostgreSQL and a sample OIDC provider (Keycloak).
#   docker compose -f deploy/compose/compose.yaml up -d
# Keycloak stands in for your real IdP; the platform only speaks standard OIDC.
name: platform-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro

volumes:
  postgres-data:
